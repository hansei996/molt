name: release

# ## 为什么镜像是 Actions 推的，而不是我在这台机器上推
#
# 在这台机器上推 ghcr.io，需要一把带 `write:packages` 的个人 token —— 那意味着
# 一份长期凭据要躺在一台游戏机的磁盘上，用完还得想怎么销毁。
#
# 在 Actions 里不用：仓库自带的 `GITHUB_TOKEN` 只在这一轮作业里有效，只要
# workflow 声明 `packages: write`，它就够用。凭据从"我保管一个东西"变成
# "GitHub 临时借给我一个东西"，差别不是方便，是**没有东西可以被偷**。
#
# ## 什么时候跑
#
# 推 `v*` 标签时真发一版（打 `latest` + `1.0.0` + `1.0` + `1` + 完整 sha）。
# `workflow_dispatch` 是给「先看看这条链路通不通」用的：它只打 `latest` 与 sha，
# **不会**覆盖 semver 标签 —— 手动跑一遍不该让 `1.0.0` 这个号提前被人占到。
#
# ## 一件我看不见、必须由人去点的事
#
# ghcr 上第一次推上去的包默认是 **private**。`docker pull ghcr.io/...:latest`
# 对匿名用户会失败（报 `denied` 或 `manifest unknown`，看起来都像"镜像不存在"）。
# 第一次发布之后，要去包的设置页把可见性改成 Public：
#   https://github.com/hansei996/molt/pkgs/container/molt
# 这一步没有 API 可以替你做（改可见性是账号级决定），所以它写在 README 里等着。
#
# ## PyPI 还没接
#
# ## PyPI：用可信发布（OIDC），仓库里一个 secret 都没有
#
# 发行名是 **`molt-handoff`**，不是 `molt` —— PyPI 上的 `molt` 已被一个 2014 年的
# Mustache 模板库占着，pending publisher 会直接报 "This project already exists."。
# 导入名与命令仍是 `molt`。
#
# 这条链上没有 token：PyPI 用 GitHub 签出的短期 OIDC 断言验「这次发布确实来自
# 这个仓库的这个 workflow」。所以仓库设置里**不要**建 `PYPI_TOKEN`，建了也不会被读。
#
# 需要你在 PyPI 网页上建一次（只一次）：
#   https://pypi.org/manage/account/publishing/ → Add a new pending publisher
#     PyPI Project Name : molt-handoff
#     Owner             : hansei996
#     Repository name   : molt
#     Workflow name     : release.yml
#     Environment name  : pypi          ← 必须和下面 `environment.name` 一致
# 名字对不上时 publish 会失败并说 "Trusted publishing exchange failure"，那不是 token 的问题。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 只读代码，写包。就这两条 —— 不给 `contents: write`，因为这个作业从不提交任何东西。
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

# 同一个标签连着推两次时不并发跑两份（两份同时 push 会有一个白跑并报错）。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 算出这次该打哪些标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `type=semver` 只在 ref 是合法 semver 标签时生效；手动跑时它们自然为空，
          # 于是只剩 latest 与 sha —— 这正是我们要的「手动跑不占版本号」。
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.title=molt
            org.opencontainers.image.description=让一个 AI 伴侣自己从一台机器走到另一台机器
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/setup-buildx-action@v3

      # 这里用的是 `secrets.GITHUB_TOKEN`，不是 PAT。
      # 用户名必须是 `github.actor`（推送者），不能写死成仓库名。
      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 只构 amd64：这个项目的两端都是 x86 家用机（NAS + 游戏机），
          # 多架构会让每次发布多花几分钟换一个没人用的 arm64 层。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 构建成功不代表"能被拉下来"。这里从 registry 反查一次 manifest ——
      # 它证明的是「推上去了」，不是「别人能拉」（那取决于包可见性，见文件头）。
      - name: 回查 registry，确认标签真的在
        run: |
          set -eu
          first="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "检查 $first"
          docker buildx imagetools inspect "$first"

      - name: 把结果写进这次运行的摘要
        if: always()
        run: |
          {
            echo "## 镜像"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "- digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- 如果这是第一次发布，记得去 https://github.com/hansei996/molt/pkgs/container/molt"
            echo "  把包可见性改成 **Public**，否则陌生人 \`docker pull\` 会失败。"
          } >> "$GITHUB_STEP_SUMMARY"

  pypi:
    name: 发布到 PyPI
    # 只在真推 `v*` 标签时发。手动触发是"看看镜像链路通不通"，不该顺手把版本发出去 ——
    # PyPI 上的版本号**发出去了就不能收回**，连删了都不允许重用同一个号。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/molt-handoff/
    # 走的是 repo secret（老大在 https://github.com/hansei996/molt/settings/secrets/actions
    # 建了 `PYPI_TOKEN`），所以**不需要** `id-token: write` —— 权限按最小给：
    # 这个作业只读代码、只读那个 secret。
    #
    # 另一条路（可信发布 / OIDC，仓库里零 secret）也不冲突：真要用它时，把下面
    # `with: password` 删掉、加回 `id-token: write`、并在 PyPI 建 pending publisher。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 版本号与标签必须一致 —— 而且判据不是"我读了源码里的字符串"，是
      # **PyPI 将会收到的那个文件名**。发出去的版本号不能收回（连删了都不许重发同一个号），
      # 所以宁可在发之前多死一次。
      - name: 构建，并用产物的文件名核对 tag / 版本 / 发行名
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist/
          test -f "dist/molt_handoff-${tag}-py3-none-any.whl" \
            || { echo "::error::wheel 不叫 molt_handoff-${tag}（发行名或版本不对）"; exit 1; }
          test -f "dist/molt_handoff-${tag}.tar.gz" \
            || { echo "::error::sdist 不叫 molt_handoff-${tag}"; exit 1; }
          echo "产物名与 tag 一致：molt_handoff-${tag}"

      # PyPI 的 API token 用户名固定是 `__token__`（action 自己填），密码就是那把 token。
      # 它在仓库 secret 里，日志里会被自动打码，我也读不到它。
      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
