name: tests

# 为什么在 Windows 和 Linux 上都跑：
# 这个项目的一半 bug 是「换机才暴露」的（路径分隔符、控制台编码、
# 文件句柄语义、sqlite 的 sidecar 行为）。只在一种系统上绿的测试
# 对这里的价值有限——上一次的 11 个 bug 里有一半属于这一类。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 项目运行时零依赖，测试只额外需要 pytest。
      # 一旦有了依赖，这一步要换成 pip install -e ".[dev]"。
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Show shell identity (诊断用)
        run: python -m molt.cli shell || true

      - name: Run tests
        run: python -m pytest -q
