name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 这个项目运行时零依赖，测试也只需要 pytest。
      # 跑得慢的话该怀疑的是代码，不是环境。
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest -q

      # 打包也要能过：有 pyproject 但装不起来的仓库，
      # 别人 `pip install .` 的第一分钟就会失败。
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
